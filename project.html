<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atul Suresh</title>
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/shared.css">
<!-- visit counter (goatcounter.com/atuldgr8): only on the real site, never on your laptop or in the editor -->
<script>
  if (!/^(localhost|127\.|\[::1\])/.test(location.hostname) && !/[?&]edit(=|&|$)/.test(location.search)) {
    const g = document.createElement('script'); g.async = true; g.src = 'https://gc.zgo.at/count.js';
    g.dataset.goatcounter = 'https://atuldgr8.goatcounter.com/count'; document.head.appendChild(g);
  }
</script>
</head>
<body>

<header class="top">
  <a class="me" href="./">Atul Suresh</a>
  <a class="nav-work" href="./#work">work</a>
  <a class="nav-resume" href="resume/Atul-Suresh-Resume.pdf" target="_blank" rel="noopener">resume</a>
</header>

<div class="stage"><div class="cv"></div></div>
<nav class="next" hidden><span>next</span><a href="#"></a></nav>

<script src="assets/canvas.js"></script>
<script src="assets/fs.js"></script>
<script src="assets/side.js"></script>
<script>
/* A project page: projects/<slug>.json drawn on the canvas.
   Add ?edit to the address to open the editor. */
(async () => {
  const q = new URLSearchParams(location.search);
  const slug = (q.get('p') || '').replace(/[^\w-]/g, '');
  const cv = document.querySelector('.cv');

  if (q.has('edit')) {
    // the editor brings its own loading and saving
    await FS.restore();
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'assets/editor.css';
    document.head.appendChild(css);
    const b = document.createElement('script'); b.src = 'assets/blocks.js';
    b.onload = () => { const s = document.createElement('script'); s.src = 'assets/editor.js'; document.body.appendChild(s); };
    document.body.appendChild(b);
    return;
  }

  const [doc, index, lib] = await Promise.all([FS.json(`projects/${slug}.json`), FS.json('projects/index.json'), FS.json('projects/components.json')]);
  const list = (index && index.projects) || [];
  const meta = list.find(p => p.slug === slug);
  if (meta) document.title = `${meta.title} · Atul Suresh`;
  // the project's own colour (from the work list): side nav, and anything set to "project" colour
  if (meta && meta.color) document.documentElement.style.setProperty('--accent', meta.color[0] === '#' ? meta.color : `var(--${meta.color})`);
  if (list.some(p => p.fun && !p.hidden)) {      // "work*": the asterisk leads to the fun list on the home page
    const st = document.createElement('span'); st.className = 'star'; st.textContent = '*';
    st.title = index.funLabel || 'and some not-work';
    st.addEventListener('click', e => { e.preventDefault(); location.href = './#fun'; });
    document.querySelector('.top .nav-work').appendChild(st);
  }

  if (!slug || !doc) {
    cv.outerHTML = '<p class="missing">Nothing here (yet). <a href="./#work">Back to work</a></p>';
    return;
  }
  const top = document.querySelector('.top');
  const blend = () => top.classList.toggle('blend', scrollY > 8);
  addEventListener('scroll', blend, { passive: true }); blend();
  Canvas.render(cv, doc, { lib: Object.fromEntries(((lib && lib.components) || []).map(c => [c.id, c])) });
  SideNav.mount({ cv });
  Canvas.layout(cv);
  Canvas.animate(cv);
  let t; addEventListener('resize', () => { cancelAnimationFrame(t); t = requestAnimationFrame(() => Canvas.layout(cv)); });
  document.fonts && document.fonts.ready.then(() => Canvas.layout(cv));
  cv.addEventListener('load', () => Canvas.layout(cv), true);

  // next project, wrapping around to the first
  const shown = list.filter(p => !p.hidden && !p.soon);
  const i = shown.findIndex(p => p.slug === slug);
  if (shown.length > 1 && i > -1) {
    const n = shown[(i + 1) % shown.length];
    const nav = document.querySelector('.next');
    nav.querySelector('a').href = `project.html?p=${n.slug}`;
    nav.querySelector('a').textContent = n.title;
    nav.hidden = false;
  }
})();
</script>
<script src="assets/hover.js"></script>
<script src="assets/local.js"></script>
</body>
</html>
