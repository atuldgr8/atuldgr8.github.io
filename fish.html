<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fish_shaped_building.jpg</title>
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  // use exactly the same text size as the main page that opened this window
  try { document.documentElement.style.setProperty('--size', getComputedStyle(opener.document.body).fontSize); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --fg: #000; --bg: #fff; --mute: #909090; --line: #000; --size: 15px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #f4f4f4; --bg: #0d0d0d; --mute: #7a7a7a; --line: #f4f4f4; }
  }
  :root[data-theme="dark"] { --fg: #f4f4f4; --bg: #0d0d0d; --mute: #7a7a7a; --line: #f4f4f4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--mute);
    font: 400 var(--size)/1.12 Inter, -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -0.07em;
    display: grid; grid-template-rows: 1fr auto;
  }
  img { display: block; width: 100%; height: 100%; object-fit: cover; min-height: 0; }
  p { padding: .5em .6em; border-top: 1px solid var(--line); }
  a { color: inherit; }
  a:hover { color: var(--fg); }
</style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/e/e2/Fish_shaped_building.jpg" width="1024" height="399"
       alt="A four-storey building shaped like a giant silver fish: the National Fisheries Development Board, Hyderabad">
  <p>NFDB, Hyderabad. Photo: <a href="https://commons.wikimedia.org/wiki/File:Fish_shaped_building.jpg" target="_blank" rel="noopener">Nagaraju Raveender</a>, CC BY-SA 3.0</p>
  <script>addEventListener('keydown', e => { if (e.key === 'Escape') close(); });</script>
</body>
</html>
