<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work · Atul Suresh</title>
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>
  // the work list lives on the home page now (scroll down from the landing).
  // This page is only for editing the list: work.html?edit
  if (!/[?&]edit(=|&|$)/.test(location.search)) location.replace('./#work');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/shared.css">
<script>
  // arriving from the landing page: slide in like the page scrolled down
  addEventListener('pagereveal', e => {
    if (!e.viewTransition) return;
    try {
      const from = navigation.activation && navigation.activation.from;
      if (from && /\/(index\.html)?$/.test(new URL(from.url).pathname)) e.viewTransition.types.add('fromlanding');
    } catch (err) {}
  });
</script>
<!-- don't draw the page until the list below exists, so the slide-in has it -->
</head>
<body class="work-page">

<header class="top">
  <a class="me" href="./">Atul Suresh</a>
  <a class="nav-work" href="./#work">work</a>
  <a class="nav-resume" href="resume/Atul-Suresh-Resume.pdf" target="_blank" rel="noopener">resume</a>
</header>

<main class="list" aria-label="Projects"></main>

<script src="assets/canvas.js"></script>
<script src="assets/fs.js"></script>
<script>
(async () => {
  await FS.restore();
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'assets/editor.css';
  document.head.appendChild(css);
  const b = document.createElement('script'); b.src = 'assets/blocks.js';
  b.onload = () => { const s = document.createElement('script'); s.src = 'assets/work-editor.js'; document.body.appendChild(s); };
  document.body.appendChild(b);
})();
</script>
<script src="assets/hover.js"></script>
<script src="assets/local.js"></script>
</body>
</html>
