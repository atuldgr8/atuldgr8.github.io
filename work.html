<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work · Atul Suresh</title>
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="work-page">

<header class="top">
  <a class="me" href="./">Atul Suresh</a>
  <a class="nav-work" href="work.html" aria-current="page">work</a>
  <a class="nav-resume" href="https://drive.google.com/file/d/1oWF_tZGkbyCLx98JRv4v-hcWlEsx6g2Q/view?usp=sharing" target="_blank" rel="noopener">resume</a>
</header>

<main class="list" aria-label="Projects"></main>
<button class="tldr-open" type="button" hidden>TL;DR</button>
<div class="tldr" role="dialog" aria-modal="true" aria-label="All projects, in short">
  <div class="tldr-top"><span class="lbl"></span><button type="button" class="x">close</button></div>
  <div class="tldr-stage"></div>
  <div class="tldr-cap"><a href="#"></a><span class="sum"></span><span class="n"></span></div>
</div>
<img class="peek" alt="" aria-hidden="true">

<script src="assets/canvas.js"></script>
<script src="assets/fs.js"></script>
<script src="assets/side.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const list = document.querySelector('.list');
  const peek = document.querySelector('.peek');

  if (q.has('edit')) {
    await FS.restore();
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'assets/editor.css';
    document.head.appendChild(css);
    const b = document.createElement('script'); b.src = 'assets/blocks.js';
    b.onload = () => { const s = document.createElement('script'); s.src = 'assets/work-editor.js'; document.body.appendChild(s); };
    document.body.appendChild(b);
    return;
  }

  const index = await FS.json('projects/index.json');
  const projects = ((index && index.projects) || []).filter(p => !p.hidden);
  if (!projects.length) { list.innerHTML = '<p class="empty">Nothing up yet. Soon.</p>'; return; }

  for (const p of projects) {
    const a = document.createElement('a');
    a.className = 'wk';
    a.href = `project.html?p=${encodeURIComponent(p.slug)}`;
    a.dataset.dock = '';
    a.innerHTML = '<span class="t"></span><span class="y"></span>';
    a.querySelector('.t').textContent = p.title;
    a.querySelector('.y').textContent = p.year || '';
    if (p.color) a.style.setProperty('--c', p.color);
    if (p.thumb) { a.dataset.thumb = p.thumb; new Image().src = p.thumb; }
    list.appendChild(a);
  }
  Dock(list, { max: .45, reach: 2.4 });

  /* the thumbnail trails the cursor, a little behind it */
  let tx = 0, ty = 0, x = 0, y = 0, raf = 0, on = false, rowRight = 0;
  const loop = () => {
    x += (tx - x) * .18; y += (ty - y) * .18;
    peek.style.transform = `translate(${x}px, ${y}px)`;
    raf = (on || Math.abs(tx - x) > .5) ? requestAnimationFrame(loop) : 0;
  };
  addEventListener('pointermove', e => {
    tx = Math.max(e.clientX + 32, rowRight + 40); ty = e.clientY - peek.offsetHeight / 2;
    if (!on) { x = tx; y = ty; }
    if (!raf) raf = requestAnimationFrame(loop);
  });
  list.addEventListener('pointerover', e => {
    const row = e.target.closest('.wk');
    if (!row || !row.dataset.thumb) { on = false; peek.classList.remove('on'); return; }
    if (peek.getAttribute('src') !== row.dataset.thumb) peek.src = row.dataset.thumb;
    rowRight = row.querySelector('.t').getBoundingClientRect().right;
    on = true; peek.classList.add('on');
    if (!raf) raf = requestAnimationFrame(loop);
  });
  list.addEventListener('pointerleave', () => { on = false; peek.classList.remove('on'); });

  /* TL;DR: one slide per project. Click (or →) for the next one, ← for the last, Esc to close. */
  const open = document.querySelector('.tldr-open'), box = document.querySelector('.tldr');
  const stage = box.querySelector('.tldr-stage'), cap = box.querySelector('.tldr-cap');
  const label = (index && index.tldr) || 'TL;DR';
  open.textContent = label; box.querySelector('.lbl').textContent = label; open.hidden = false;
  const slides = projects.map(p => {
    const d = document.createElement('div'); d.className = 'tldr-slide';
    if (p.thumb) { const i = document.createElement('img'); i.src = p.thumb; i.alt = p.title; i.loading = 'lazy'; d.appendChild(i); }
    else { const n = document.createElement('div'); n.className = 'noimg'; d.appendChild(n); }
    stage.appendChild(d); return d;
  });
  let at = 0;
  const show = i => {
    at = (i + projects.length) % projects.length;
    slides.forEach((s, j) => s.classList.toggle('on', j === at));
    const p = projects[at], a = cap.querySelector('a');
    a.textContent = p.title; a.href = `project.html?p=${encodeURIComponent(p.slug)}`;
    p.color ? a.style.setProperty('--c', p.color) : a.style.removeProperty('--c');
    cap.querySelector('.sum').textContent = [p.summary, p.year].filter(Boolean).join(' · ');
    cap.querySelector('.n').textContent = `${at + 1} / ${projects.length}`;
  };
  const close = () => { box.classList.remove('on'); open.focus(); };
  open.addEventListener('click', () => { show(0); box.classList.add('on'); box.querySelector('.x').focus(); });
  box.querySelector('.x').addEventListener('click', close);
  stage.addEventListener('click', e => { const r = stage.getBoundingClientRect(); show(at + (e.clientX - r.left < r.width / 3 ? -1 : 1)); });
  stage.addEventListener('pointermove', e => { const r = stage.getBoundingClientRect(); stage.style.cursor = e.clientX - r.left < r.width / 3 ? 'w-resize' : 'e-resize'; });
  addEventListener('keydown', e => {
    if (!box.classList.contains('on')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(at + 1); }
    if (e.key === 'ArrowLeft') show(at - 1);
  });
})();
</script>
<script src="assets/local.js"></script>
</body>
</html>
